# The whole `npm run check` of the npm package @action-state-group/capsule-viewer
# (ts/) on Node 22 and 24, nightly. Every pull request and push to main runs the
# same check in ci.yml's ts job; this catches what changes without a commit,
# such as the hosted runner's Chrome. scripts/ci-local.sh runs it before a push.
name: TypeScript full check

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A nightly run is never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  ts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      # The CSP and offline-page browser tests skip without a Chrome; the
      # hosted runner ships one, so its absence is a failure here.
      - run: test -x /usr/bin/google-chrome
      - run: npm run check

  # A red nightly run opens or comments on one ci-red issue.
  report-failure:
    needs: [ts]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Report the red run
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "TypeScript full check failed on main or nightly"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.CI_FAILURE_ASSIGNEE }}
        run: bash .github/scripts/report-failure.sh
