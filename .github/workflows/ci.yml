name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      # The presentation contract's schema, examples and checkers, moved from
      # agent-action-capsule (AAC#379), and the moved spec text compared with
      # AAC at the revision the script pins.
      - name: Presentation manifest fixtures (schema, negatives, mutants, resolution)
        run: python schemas/check_presentation_manifest_examples.py
      - name: Contract-report wording pack and vendored AAC files
        run: python schemas/check_contract_report_examples.py
      # The moved spec text is compared with the AAC revision it moved from;
      # the vendored copies with the revision they were last taken at, which
      # moves with each AAC pin bump.
      - name: Moved spec text and vendored AAC files, against their pinned AAC revisions
        run: |
          rev="$(python scripts/check-moved-spec.py --rev)"
          vendored="$(python scripts/check-vendored-aac.py --print-rev)"
          git init -q "$RUNNER_TEMP/aac"
          git -C "$RUNNER_TEMP/aac" fetch -q --depth 1 https://github.com/action-state-group/agent-action-capsule.git "$rev" "$vendored"
          python scripts/check-moved-spec.py --aac "$RUNNER_TEMP/aac"
          python scripts/check-vendored-aac.py --aac "$RUNNER_TEMP/aac" --rev "$vendored"
      # Warns, never fails: a vendored agent-action-capsule file that AAC's
      # main has since changed is due to be re-vendored, with the AAC release
      # capsule-viewer pins.
      - name: Vendored agent-action-capsule files against its main (warning)
        continue-on-error: true
        run: |
          git clone -q --depth 1 https://github.com/action-state-group/agent-action-capsule.git "$RUNNER_TEMP/aac-main"
          python scripts/check-vendored-aac.py --aac "$RUNNER_TEMP/aac-main" || echo "::warning::vendored agent-action-capsule files differ from its main; re-vendor them with the next AAC pin bump"
      - name: Release helper
        run: pytest -q .github/test_release.py

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test

  # The npm package @action-state-group/capsule-viewer. publish-ts.yml runs the
  # same `npm run check` before uploading.
  ts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      # The CSP and offline-page browser tests skip without a Chrome; the
      # hosted runner ships one, so its absence is a failure here.
      - run: test -x /usr/bin/google-chrome
      - run: npm run check

  # The Go module github.com/action-state-group/capsule-viewer/go. A Go release
  # is the pushed go/v* tag itself, so this job on main is its only gate.
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod
      - name: Check formatting and module files
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git -C .. status --porcelain -- go
          test -z "$(git -C .. status --porcelain -- go)"
      - run: go vet ./...
      - run: go test -race ./...

  # The page runtime go/pageruntime ships, rebuilt at the commit it states
  # (pageruntime.Commit) and compared byte for byte.
  pageruntime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: scripts/pageruntime.sh
