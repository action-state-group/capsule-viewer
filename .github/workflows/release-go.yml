# SPDX-License-Identifier: Apache-2.0
# Publish the GitHub Release for a go/v<version> tag of the Go module
# github.com/action-state-group/capsule-viewer/go (see RELEASING.md).
#
# The module version exists as soon as an admin pushes the tag; this workflow
# checks it and publishes the page runtime it ships as release assets, so a
# reader without Go can fetch and verify the same bytes. It refuses a tag whose
# commit is not on main, whose runtime is not the one built at
# pageruntime.Commit, or whose runtime states a viewer version other than the
# tag's. The assets get a GitHub build provenance attestation, verifiable with
#   gh attestation verify FILE --repo action-state-group/capsule-viewer \
#     --signer-workflow action-state-group/capsule-viewer/.github/workflows/release-go.yml
# and the attestation bundle is published as pageruntime-v<version>.sigstore.json.
name: Release · Go

on:
  push:
    tags: ["go/v*"]

permissions: {}

concurrency:
  group: release-go-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.ref_name }}
    permissions:
      contents: write
      id-token: write # OIDC token for the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag, its commit and the version the runtime states
        run: |
          VERSION="${TAG#go/v}"
          printf '%s\n' "$VERSION" | grep -Eqx '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?' \
            || { echo "::error::$TAG is not go/v<major>.<minor>.<patch>[-<pre-release>]"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG is on $GITHUB_SHA, which is not on main"; exit 1; }
          # A viewer release X is ts/vX and go/vX: the runtime this module
          # ships must say it is viewer X, the version its pages state.
          grep -Fq "viewerVersion: \"$VERSION\"," go/pageruntime/evidence-graph.iife.js \
            || { echo "::error::go/pageruntime/evidence-graph.iife.js does not state viewerVersion $VERSION; set ts/package.json to $VERSION and refresh the runtime first"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Rebuild the runtime at pageruntime.Commit and compare
        run: scripts/pageruntime.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Vet and test the module
        working-directory: go
        run: |
          go vet ./...
          go test ./...
      - name: Stage the release assets
        run: |
          mkdir dist
          cp go/pageruntime/evidence-graph.iife.js go/pageruntime/evidence-graph.iife.js.sha256 \
            go/emitter/runtime-style-hashes.txt dist/
          echo "SHA256=$(cat dist/evidence-graph.iife.js.sha256)" >> "$GITHUB_ENV"
          echo "RUNTIME_COMMIT=$(sed -n 's/^const Commit = "\([0-9a-f]\{40\}\)"$/\1/p' go/pageruntime/pageruntime.go)" >> "$GITHUB_ENV"
      - name: Attest build provenance of the assets
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
      - name: Attach the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/pageruntime-v$VERSION.sigstore.json"
      - name: Publish GitHub release
        # A version with a hyphen is a pre-release, never marked the latest.
        # A draft left by a run that died mid-upload is finished here; a
        # published release is never changed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$VERSION" in
            *-*) flags=(--prerelease --latest=false) ;;
          esac
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "::error::release $TAG is already published"; exit 1
            fi
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}" \
              --title "$TAG" \
              --notes "Go module github.com/action-state-group/capsule-viewer/go v$VERSION, viewer $VERSION. Its page runtime (go/pageruntime) is evidence-graph.iife.js, sha256 $SHA256, built at $RUNTIME_COMMIT; runtime-style-hashes.txt lists the CSP hashes of the styles it inserts. Check the build attestation with no GitHub account: gh attestation verify FILE --bundle pageruntime-v$VERSION.sigstore.json --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release-go.yml. See CHANGELOG.md."
          fi
