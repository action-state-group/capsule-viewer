<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="__CSP_SLOT__" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__TITLE_SLOT__</title>
    <style>
      /*
       * Base shell stylesheet. It owns the page frame only: theme tokens,
       * typography baseline, page width, overflow containment, focus and
       * motion defaults, native details/summary disclosure, the
       * verification-banner area and print defaults. Every rule sits inside
       * :where() so it has zero specificity and any presentation module's
       * own stylesheet wins. No report layout lives here.
       */
      :root {
        --aac-bg: #ffffff;
        --aac-fg: #1f2733;
        --aac-muted: #6b7482;
        --aac-line: #e3ded3;
        --aac-accent: #232f42;
        --aac-focus: #2b5a85;
        --aac-ok: #2e7d5b;
        --aac-ok-bg: #e3f1ea;
        --aac-bad: #b5462f;
        --aac-bad-bg: #f8e6e1;
        --aac-warn: #8a6a2f;
        --aac-warn-bg: #fbefd9;
        --aac-font: system-ui, sans-serif;
        --aac-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --aac-line-height: 1.5;
        --aac-page-width: 60rem;
        --aac-gutter: 1rem;
        --aac-page-pad-block: 1.5rem 2.5rem;
        --aac-radius: 10px;
        /* A report's frame: the page colour behind its cards, and the one
           inset every card's content starts at. */
        --aac-page-bg: #eef0f3;
        --aac-inset: clamp(20px, 5vw, 56px);
      }
      :where(html) {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      :where(body) {
        margin: 0;
        font-family: var(--aac-font);
        line-height: var(--aac-line-height);
        color: var(--aac-fg);
        background: var(--aac-bg);
        overflow-wrap: break-word;
      }
      :where(#app) {
        box-sizing: border-box;
        max-width: var(--aac-page-width);
        margin-inline: auto;
        padding-inline: var(--aac-gutter);
        padding-block: var(--aac-page-pad-block);
      }
      /* A module with its own frame (the outcome and compliance cards) keeps
         it; a module's own .cv-page drops its width and padding here, so no
         page is padded twice (capsule-viewer#60). These two rules use #app
         so they win over a module's own stylesheet; a theme overrides them
         with an #app selector of its own. */
      #app.cv-shell-chrome {
        max-width: none;
        padding: 0 var(--aac-gutter);
      }
      :where(body:has(> #app.cv-shell-chrome)) {
        background: var(--aac-page-bg);
      }
      #app .cv-page {
        max-width: none;
        margin: 0;
        padding: 0;
      }
      :where(.cv-shell-bar) {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem;
        margin: 0 0 0.75rem;
      }
      :where(.cv-pill) {
        display: inline-block;
        padding: 0.0625rem 0.625rem;
        border: 1px solid currentColor;
        border-radius: 999px;
        font-size: 0.8125rem;
        font-weight: 600;
        line-height: 1.6;
      }
      :where(.cv-pill[data-verify="verified"]) {
        color: var(--aac-ok);
        background: var(--aac-ok-bg);
      }
      :where(.cv-pill[data-verify="failed"]) {
        color: var(--aac-bad);
        background: var(--aac-bad-bg);
      }
      :where(.cv-pill[data-verify="incomplete"]) {
        color: var(--aac-warn);
        background: var(--aac-warn-bg);
      }
      :where(.cv-pill[data-verify="checking"]) {
        color: var(--aac-muted);
      }
      /* The details line under the bar: the findings behind an incomplete
         or failed verdict, in the core's words. */
      :where(.cv-banner-detail) {
        margin: 0 0 0.75rem;
        font-size: 0.8125rem;
        color: var(--aac-muted);
      }
      /* The witness notice: a bundle that checks only against its holder's
         own signatures, in the warning colour. */
      :where(.cv-witness-notice) {
        color: var(--aac-warn);
      }
      :where(.cv-shell-note) {
        font-size: 0.8125rem;
        color: var(--aac-muted);
      }
      :where(.cv-shell-detail, .cv-shell-link) {
        font-size: 0.8125rem;
        color: var(--aac-muted);
      }
      :where(.cv-shell-detail:empty) {
        display: none;
      }
      /* A report's frame: the bar becomes one full-width callout at the
         top of the page, the verdict first, then the counts and the link.
         It is green for a verified bundle; a report also renders when no
         check failed but some were not run, or when a check failed and the
         records are still shown, and the bar then takes that state's
         colours (below). */
      #app.cv-shell-chrome :where(.cv-shell-bar) {
        max-width: 1080px;
        box-sizing: border-box;
        margin: 1rem auto 0;
        /* The 6px left border is part of the inset: the text starts where
           every card's content starts. */
        padding: 0.75rem calc(var(--aac-inset) - 1px) 0.75rem
          calc(var(--aac-inset) - 5px);
        justify-content: flex-start;
        gap: 0.375rem 0.75rem;
        border: 1px solid var(--aac-ok);
        border-left-width: 6px;
        border-radius: 10px;
        background: var(--aac-ok-bg);
      }
      #app.cv-shell-chrome :where(.cv-shell-bar.cv-incomplete) {
        border-color: var(--aac-warn);
        background: var(--aac-warn-bg);
      }
      #app.cv-shell-chrome :where(.cv-shell-bar.cv-failed) {
        border-color: var(--aac-bad);
        background: var(--aac-bad-bg);
      }
      /* The banner and its notices have no toggle: the core draws them, and
         the square at their left edge says so (Terms Pack, the toggle). */
      #app.cv-shell-chrome :where(.cv-shell-bar)::before,
      #app.cv-shell-chrome :where(.cv-banner-detail)::before {
        content: "\25A0";
        content: "\25A0" / "";
        flex: none;
        width: 1em;
        margin-right: 0.25rem;
        font-size: 0.75rem;
        line-height: 1;
        color: #8a93a0;
      }
      #app.cv-shell-chrome :where(.cv-banner-detail)::before {
        display: inline-block;
      }
      #app.cv-shell-chrome :where(.cv-banner-detail) {
        max-width: 1080px;
        box-sizing: border-box;
        margin: 0.375rem auto 0;
        padding: 0 var(--aac-inset);
      }
      #app.cv-shell-chrome :where(.cv-pill) {
        padding: 0;
        border: 0;
        background: transparent;
        font-size: 1rem;
        font-weight: 700;
      }
      #app.cv-shell-chrome :where(.cv-shell-detail) {
        font-size: 0.875rem;
        color: inherit;
      }
      #app.cv-shell-chrome :where(.cv-shell-link) {
        margin-left: auto;
        font-size: 0.875rem;
        font-weight: 600;
      }
      /* A bundle with a failed check: on every page the core draws the
         bar as a red callout, the verdict first, then the check section's
         counts and the link to it. It does not wait for a report's frame:
         no report renders on a bundle the page refuses. */
      :where(.cv-shell-bar.cv-failed) {
        box-sizing: border-box;
        padding: 0.75rem 1rem;
        justify-content: flex-start;
        gap: 0.375rem 0.75rem;
        border: 1px solid var(--aac-bad);
        border-left-width: 6px;
        border-radius: 10px;
        background: var(--aac-bad-bg);
      }
      :where(.cv-shell-bar.cv-failed .cv-pill) {
        padding: 0;
        border: 0;
        background: transparent;
        font-size: 1rem;
        font-weight: 700;
      }
      :where(.cv-shell-bar.cv-failed .cv-shell-detail) {
        font-size: 0.875rem;
        color: var(--aac-fg);
      }
      :where(.cv-shell-bar.cv-failed .cv-shell-link) {
        margin-left: auto;
        font-size: 0.875rem;
        font-weight: 600;
      }
      :where(details.cv-checked) {
        margin: 2rem 0 0;
        padding: 0.75rem 0 0;
        border-top: 1px solid var(--aac-line);
      }
      /* In a report's frame the check section is a card like the
         report's own, folded to its one line until opened. */
      #app.cv-shell-chrome :where(details.cv-checked) {
        box-sizing: border-box;
        max-width: 1080px;
        margin: 0 auto 16px;
        padding: 18px var(--aac-inset);
        border: 1px solid var(--aac-line);
        border-radius: 14px;
        background: var(--aac-bg);
      }
      :where(details.cv-checked > summary) {
        font-size: 0.875rem;
        color: var(--aac-muted);
      }
      :where(img, svg, video, canvas) {
        max-width: 100%;
        height: auto;
      }
      :where(pre) {
        overflow-x: auto;
      }
      :where(code, kbd, samp, pre) {
        font-family: var(--aac-mono);
      }
      :where(summary) {
        cursor: pointer;
      }
      :where(:focus-visible) {
        outline: 2px solid var(--aac-focus);
        outline-offset: 2px;
      }
      :where(.aac-banner) {
        display: block;
        margin: 0 0 1rem;
        padding: 0.75rem 1rem;
        border: 1px solid var(--aac-line);
        border-radius: var(--aac-radius);
      }
      :where(.aac-banner[data-state="verified"]) {
        color: var(--aac-ok);
        background: var(--aac-ok-bg);
      }
      :where(.aac-banner[data-state="failed"]) {
        color: var(--aac-bad);
        background: var(--aac-bad-bg);
      }
      :where(.aac-banner[data-state="partial"]) {
        color: var(--aac-warn);
        background: var(--aac-warn-bg);
      }
      @media (max-width: 760px) {
        :where(table) {
          display: block;
          max-width: 100%;
          overflow-x: auto;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        :where(*, *::before, *::after) {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      @media print {
        :where(body) {
          color: #000;
          background: #fff;
        }
        :where(#app) {
          max-width: none;
          padding: 0;
        }
        :where(summary, h1, h2, h3, h4) {
          break-after: avoid;
        }
        :where(tr, img, svg, figure) {
          break-inside: avoid;
        }
      }
    </style>
    <!-- prettier-ignore -->
    <style>__THEME_SLOT__</style>
  </head>
