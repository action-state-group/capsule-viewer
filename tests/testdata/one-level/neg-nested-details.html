<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Negative fixture: a details inside a details</title>
</head>
<body class="cv-kit">
<!-- Must FAIL the one-level check: the L1 toggle holds a second toggle. Every
     other part of the consumer contract holds, so the nesting is the only fault. -->
<main class="cv-page">
<div class="cv-verification" data-cv="verification-details"><div class="cv-verification__outcome-row"><span class="cv-verification__outcome cv-pill cv-tone--positive" data-outcome="verified">Verified</span></div></div>
<div data-level="L0">
<h2>Example title</h2>
<div class="cv-metrics-wrap" data-cv="metric-grid"><dl class="cv-metrics">
<div class="cv-metric"><dt class="cv-metric__label">Example metric</dt><dd class="cv-metric__value">1</dd></div>
</dl></div>
</div>
<div data-level="L1">
<details class="cv-drilldown" data-cv="drilldown"><summary>Example level one</summary><div class="cv-drilldown__body">
<p>Example text.</p>
<details class="cv-drilldown" data-cv="drilldown"><summary>Example level two, nested</summary><div class="cv-drilldown__body"><p>Example nested text.</p></div></details>
</div></details>
</div>
</main>
</body>
</html>
