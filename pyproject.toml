[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-viewer"
version = "0.0.1"
description = "The offline, fragment-carried capsule/Result viewer: base shell + in-browser recompute, with domain modules registered on CapsuleViewer.register(kind, renderCard)."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Action State Group" }]
keywords = ["agent", "capsule", "viewer", "evidence"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/action-state-group/capsule-viewer"
Source = "https://github.com/action-state-group/capsule-viewer"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["capsule_viewer*"]

[tool.setuptools.package-data]
capsule_viewer = ["static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
