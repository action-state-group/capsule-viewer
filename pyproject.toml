[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-viewer"
version = "0.0.1"
description = "The offline, fragment-carried capsule/Result viewer: base shell + in-browser recompute, with domain modules registered on CapsuleViewer.register(kind, renderCard)."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Action State Group" }]
keywords = ["agent", "capsule", "viewer", "evidence"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/action-state-group/capsule-viewer"
Source = "https://github.com/action-state-group/capsule-viewer"

[project.optional-dependencies]
# The evidence report page renders capsule-emit's verifier result; the check
# itself is capsule-emit's (capsule_emit.evidence_file.check_evidence_file).
# 0.12: the ledger page draws a bundle `capsule-emit bundle` wrote (#338).
evidence = ["capsule-emit>=0.12,<0.14"]
# The tests build and sign their records with capsule_emit.produce, which no
# release has yet (PyPI 0.13.0 predates it): pinned to the merged capsule-emit
# main revision (version 0.13.0, inside the evidence range) until the next
# release, so CI tests 0.13.
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "jsonschema>=4.18",
    "capsule-emit @ git+https://github.com/action-state-group/capsule-emit@e233c51438d84b9b0e1ed734f5a0554ced0d0ff3#subdirectory=python",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["capsule_viewer*"]

[tool.setuptools.package-data]
capsule_viewer = ["static/*.js", "static/*.css", "ledger/*.json", "receipt/*.json", "receipt/module-slot/*.json", "rules/*.json", "history/*.json", "standard_history/*.json", "adjudications/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
